apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authorization
  labels:
    app.kubernetes.io/name: authorization
    app.kubernetes.io/part-of: authorization
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /authorization/api
      filters:
      - type: RequestHeaderModifier
        requestHeaderModifier:
          set:
          - name: l5d-dst-override
            value: authz-api.product-authorization.svc.cluster.local:80
      backendRefs:
        - name: authz-api
          port: 80
