apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: product-authorization
labels:
  - pairs:
      app.kubernetes.io/part-of: authorization
    includeSelectors: true
    includeTemplates: true
resources:
  - ../base
  - 05-cache.yaml

configMapGenerator:
  - name: environment
    namespace: product-authorization
    envs:
      - ./config/environment.env

generatorOptions:
  disableNameSuffixHash: true

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: authz-api
      spec:
        template:
          spec:
            containers:
              - name: authorization
                env:
                  - name: Altinn__Cache__Username
                    valueFrom:
                      secretKeyRef:
                        name: authorization-cache-cache-auth
                        key: username
                        optional: true
                volumeMounts:
                  - name: cache-auth
                    mountPath: /var/run/secrets/cache
                    readOnly: true
            volumes:
              - name: cache-auth
                secret:
                  secretName: authorization-cache-cache-auth
                  optional: true
                  items:
                    - key: password
                      path: password
