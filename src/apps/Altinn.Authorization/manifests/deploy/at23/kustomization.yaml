apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: product-authorization
labels:
  - pairs:
      app.kubernetes.io/part-of: authorization
    includeSelectors: true
    includeTemplates: true
resources:
  - ../base
configMapGenerator:
  - name: environment
    envs:
      - ./config/environment.env
patches:
  - patch: |-
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: authorization
      spec:
        hostnames:
          - authorization.at23.dis-core.altinn.cloud
generatorOptions:
  disableNameSuffixHash: true
