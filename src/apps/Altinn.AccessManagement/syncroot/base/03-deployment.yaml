apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: deployment
spec:
  interval: 10m
  path: ./fake
  prune: true
  wait: true
  targetNamespace: product-accessmanagement

  sourceRef:
    kind: OCIRepository
    name: manifests

  dependsOn:
    - name: 'pre-deployment'
