apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-database
spec:
  activeDeadlineSeconds: 86400 # 24 hours
  backoffLimit: 0
  template:
    metadata:
      annotations:
        migration.alxandr.me/revision: "3"
      labels:
        app.kubernetes.io/name: accessmanagement
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 1000
        runAsGroup: 3000
        allowPrivilegeEscalation: false

      containers:
        - name: accessmanagement
          image: ghcr.io/altinn/altinn-auth/accessmanagement:${VERSION}
          imagePullPolicy: Always
          securityContext:
            runAsUser: 1000
            runAsGroup: 1002
          envFrom:
            - configMapRef:
                name: environment
          env:
            - name: RunInitOnly
              value: 'true'
