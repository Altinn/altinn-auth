apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: product-access-management
labels:
  - pairs:
      app.kubernetes.io/part-of: access-management
    includeSelectors: true
    includeTemplates: true
resources:
  - ../base
  - 05-cache.yaml

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: am-api
      spec:
        template:
          spec:
            containers:
              - name: access-management
                resources:
                  requests:
                    cpu: 50m
                    memory: 384Mi
                env:
                  - name: Altinn__Cache__Username
                    valueFrom:
                      secretKeyRef:
                        name: access-management-cache-cache-auth
                        key: username
                        optional: true
                volumeMounts:
                  - name: cache-auth
                    mountPath: /var/run/secrets/cache
                    readOnly: true
            volumes:
              - name: cache-auth
                secret:
                  secretName: access-management-cache-cache-auth
                  optional: true
                  items:
                    - key: password
                      path: password
