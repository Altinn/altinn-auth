apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: product-accessmanagement
resources:
  - ../base

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: access-management
      spec:
        template:
          spec:
            containers:
              - name: accessmanagement
                resources:
                  requests:
                    cpu: 50m
                    memory: 384Mi
