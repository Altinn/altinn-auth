apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: product-access-management
labels:
  - pairs:
      app.kubernetes.io/part-of: access-management
    includeSelectors: true
    includeTemplates: true
resources:
  - ../base

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: am-api
      spec:
        template:
          spec:
            containers:
              - name: access-management
                resources:
                  requests:
                    cpu: 50m
                    memory: 384Mi
