apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: product-accessmanagement
resources:
  - ../../app
patches:
  - target:
      kind: Deployment
      name: access-management
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: access-management
      spec:
        template:
          spec:
            containers:
              - name: access-management
                env:
                  - name: OTEL_TRACES_SAMPLER_ARG
                    value: "1"
