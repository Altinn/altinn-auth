apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: access-management-hpa
  labels:
    app.kubernetes.io/name: access-management-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: access-management
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
