apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: resource-registry-hpa
  labels:
    app.kubernetes.io/name: rr-api
    app.kubernetes.io/instance: rr-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rr-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
