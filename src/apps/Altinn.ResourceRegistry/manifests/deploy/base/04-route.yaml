apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: resource-registry
  labels:
    app.kubernetes.io/name: resource-registry
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /resourceregistry/api
      filters:
      - type: RequestHeaderModifier
        requestHeaderModifier:
          set:
          - name: l5d-dst-override
            value: rr-api.product-resource-registry.svc.cluster.local:80
      backendRefs:
        - name: rr-api
          port: 80
