apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: product-resource-registry
resources:
  - 01-identity.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: resource-registry
configMapGenerator:
  - name: environment
    envs:
      - ./config/environment.env

generatorOptions:
  disableNameSuffixHash: true
