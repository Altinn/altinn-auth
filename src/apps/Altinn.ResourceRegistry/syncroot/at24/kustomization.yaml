apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: product-resource-registry
resources:
  - ../base
patches:
  - target:
      kind: OCIRepository
      name: manifests
    patch: |-
      apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: manifests
      spec:
        ref:
          tag: at24

  - target:
      kind: Kustomization
      name: pre-deploy
    patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: pre-deploy
      spec:
        path: ./pre-deploy/at24

  - target:
      kind: Kustomization
      name: deploy
    patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: deploy
      spec:
        path: ./deploy/at24
