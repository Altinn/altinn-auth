apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: product-authentication
labels:
  - pairs:
      app.kubernetes.io/part-of: authentication
    includeSelectors: true
    includeTemplates: true
resources:
  - ../base
  - 01-secrets.yaml

configMapGenerator:
  - name: environment
    behavior: merge
    envs:
      - ./config/environment.env

generatorOptions:
  disableNameSuffixHash: true

patches:
  - patch: |-
      apiVersion: vault.dis.altinn.cloud/v1alpha1
      kind: Vault
      metadata:
        name: authentication-vault
      spec:
        groupObjectId: 77287093-5698-4886-8bba-e856ca7fff39 # DIS
