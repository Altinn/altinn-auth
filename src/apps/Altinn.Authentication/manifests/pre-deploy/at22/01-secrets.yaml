apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authn-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: authn-api-vault-secret-store
  target:
    name: authn-api-secrets
  data:
    - secretKey: OidcProviders__uidp__ClientSecret
      remoteRef:
        key: OidcProviders--uidp--ClientSecret
    - secretKey: OidcProviders__helseid__ClientAssertionPrivateKeyJwk
      remoteRef:
        key: OidcProviders--helseid--ClientAssertionPrivateKeyJwk
    - secretKey: OidcProviders__idporten__ClientSecret
      remoteRef:
        key: OidcProviders--idporten--ClientSecret
    - secretKey: OidcProviders__mockporten__ClientSecret
      remoteRef:
        key: OidcProviders--mockporten--ClientSecret
