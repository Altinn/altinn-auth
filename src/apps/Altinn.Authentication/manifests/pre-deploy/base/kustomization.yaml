apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: product-authentication
resources:
  - 01-identity.yaml
  - 02-vault.yaml
  # - 03-db-migration.yaml should be added once authentication support init flag for db migration

labels:
  - pairs:
      app.kubernetes.io/part-of: authentication
configMapGenerator:
  - name: environment
    envs:
      - ./config/environment.env

generatorOptions:
  disableNameSuffixHash: true
