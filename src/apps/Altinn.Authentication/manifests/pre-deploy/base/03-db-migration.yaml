apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-database
  labels:
    app.kubernetes.io/name: authentication-migrate-database
spec:
  activeDeadlineSeconds: 86400 # 24 hours
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentication-migrate-database
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: am-init
      restartPolicy: Never
      securityContext:
        runAsUser: 1000
        runAsGroup: 3000

      containers:
        - name: authentication
          image: ghcr.io/altinn/altinn-auth/authentication-api:{{GIT_SHA}}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false

          resources:
            requests:
              cpu: 750m
              memory: 1500Mi

          envFrom:
            - configMapRef:
                name: environment
          env:
            - name: RunInitOnly
              value: 'true'
            - name: K8S_CONTAINER_NAME
              value: authentication
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: Altinn__ClusterInfo__TrustedProxies
              valueFrom:
                configMapKeyRef:
                  name: clusterinfo
                  key: trusted_proxies

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: altinn-appsettings
              mountPath: "/altinn-appsettings"
            - name: accesstoken
              mountPath: "/accesstoken"

      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
        - name: altinn-appsettings
          secret:
            secretName: altinn-appsettings-secret
        - name: accesstoken
          secret:
            secretName: accesstoken
