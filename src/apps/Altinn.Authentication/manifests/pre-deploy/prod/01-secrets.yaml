apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authn-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: authn-api-vault-secret-store
  target:
    name: authn-api-secrets
  data:
    - secretKey: OidcProviders__feide__ClientSecret
      remoteRef:
        key: OidcProviders__feide__ClientSecret
    - secretKey: OidcProviders__uidp-anonym__ClientSecret
      remoteRef:
        key: OidcProviders__uidp-anonym__ClientSecret
    - secretKey: OidcProviders__idporten__ClientSecret
      remoteRef:
        key: OidcProviders__idporten__ClientSecret
