apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: product-authentication
labels:
  - pairs:
      app.kubernetes.io/part-of: authentication
    includeSelectors: true
    includeTemplates: true
resources:
  - ../base

patches:
  - patch: |-
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: authentication
      spec:
        hostnames:
          - authentication.prod.dis-core.altinn.cloud
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: authn-api
      spec:
        template:
          spec:
            containers:
              - name: authentication
                resources:
                  requests:
                    cpu: 50m
                    memory: 384Mi
