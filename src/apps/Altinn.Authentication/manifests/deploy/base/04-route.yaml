apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentication
  labels:
    app.kubernetes.io/name: authentication
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /authentication/api
      filters:
      - type: RequestHeaderModifier
        requestHeaderModifier:
          set:
          - name: l5d-dst-override
            value: authn-api.product-authentication.svc.cluster.local:80
      backendRefs:
        - name: authn-api
          port: 80
