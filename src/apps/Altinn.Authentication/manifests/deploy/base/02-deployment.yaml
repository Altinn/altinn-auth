apiVersion: apps/v1
kind: Deployment
metadata:
  name: authn-api
  labels:
    app.kubernetes.io/name: authn-api
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: authn-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authn-api
        azure.workload.identity/use: "true"
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
        linkerd.io/inject: enabled
    spec:
      serviceAccountName: authn-api
      securityContext:
        runAsUser: 1000
        runAsGroup: 3000

      containers:
        - name: authentication
          image: ghcr.io/altinn/altinn-auth/authentication-api:{{GIT_SHA}}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 750m
              memory: 1500Mi
          envFrom:
            - secretRef:
                name: authn-api-secrets
            - configMapRef:
                name: environment
          env:
            - name: K8S_CONTAINER_NAME
              value: authentication
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: Altinn__ClusterInfo__TrustedProxies
              valueFrom:
                configMapKeyRef:
                  name: clusterinfo
                  key: trusted_proxies
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            # an http probe
            httpGet:
              path: /health/
              port: 8080
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
              # an http probe
              httpGet:
                path: /health/
                port: 8080
              failureThreshold: 3
              periodSeconds: 10
              timeoutSeconds: 10
          startupProbe:
              # an http probe
              httpGet:
                path: /health/
                port: 8080
              failureThreshold: 30
              periodSeconds: 10
              timeoutSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: altinn-appsettings
              mountPath: "/altinn-appsettings"
            - name: accesstoken
              mountPath: "/accesstoken"

      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
        - name: altinn-appsettings
          secret:
            secretName: altinn-appsettings-secret
        - name: accesstoken
          secret:
            secretName: accesstoken
