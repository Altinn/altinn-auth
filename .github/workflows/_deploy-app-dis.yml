name: "Template: Release App"

on:
  workflow_dispatch:
    inputs:
      app:
        default: Altinn.AccessManagement
        required: true
        description: App
        options:
          - Altinn.AccessManagement
          - Altinn.Authorization
        type: choice

      image_name:
        description: Image Name
        type: choice
        options:
          - ghcr.io/altinn/altinn-auth/access-management
          - ghcr.io/altinn/altinn-auth/authorization

      image_tag:
        description: Image Tag
        default: latest
        type: string

      environment:
        default: at22
        description: Environment
        type: choice
        options:
          - at22
          - at23
          - at24
          - yt01
          - tt02
          - prod

  workflow_call:
    inputs:
      app:
        required: true
        description: Path of the App
        type: string

      image_name:
        description: image name
        type: string

      image_tag:
        required: true
        type: string

      environment:
        required: true
        description: Environment in lowercase
        type: string

permissions:
  contents: read
  packages: write
  pull-requests: write
  id-token: write

jobs:
  deploy-app:
    runs-on: ubuntu-latest
    name: Deploy App to DIS
    env:
      DEPLOY_DIR: src/apps/${{ inputs.app }}/deploy/environments/${{ inputs.environment }}
      DEPLOY_OUT: dist

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install kustomize
        env:
          KUSTOMIZE_VERSION: v5.8.1
        run: |
          set -euo pipefail

          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64 | arm64) arch=arm64 ;;
            *) echo "::error::Unsupported architecture: $(uname -m)"; exit 1 ;;
          esac

          dest="${RUNNER_TEMP:-/tmp}/kustomize-bin"
          mkdir -p "$dest"
          tarball="kustomize_${KUSTOMIZE_VERSION}_linux_${arch}.tar.gz"
          url="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/${tarball}"

          if command -v curl >/dev/null 2>&1; then
            curl -fsSL "$url" -o "$dest/$tarball"
          elif command -v wget >/dev/null 2>&1; then
            wget -qO "$dest/$tarball" "$url"
          else
            echo "::error::Neither curl nor wget is available on the runner."
            exit 1
          fi

          tar -xzf "$dest/$tarball" -C "$dest" kustomize
          rm -f "$dest/$tarball"
          chmod +x "$dest/kustomize"
          echo "$dest" >> "$GITHUB_PATH"
          "$dest/kustomize" version

      - name: Run kustomize
        working-directory: ${{ env.DEPLOY_DIR }} 
        run: |
          mkdir dist

          kustomize edit set image ${{ inputs.image_name }}:latest=${{ inputs.image_name }}:${{ inputs.image_tag }}
          kustomize build -o ${{ env.DEPLOY_OUT }}/deployment.yaml

          cat ${{ env.DEPLOY_OUT }}/deployment.yaml

      - name: Build and push app manifests artifact
        uses: Altinn/altinn-platform/actions/flux/build-push-image@523f141da4f116fdd7331585396d83a5d7ade7ea # main
        with:
          image_name: ${{ inputs.image_name }}
          tag: fix/dis
          workdir: ${{ env.DEPLOY_DIR }}/${{ env.DEPLOY_OUT }}
          azure_subscription_id: ${{ secrets.DIS_SYNCROOT_AZURE_SUBSCRIPTION_ID }}
          azure_app_id: ${{ secrets.DIS_SYNCROOT_AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ secrets.DIS_SYNCROOT_AZURE_TENANT_ID }}
