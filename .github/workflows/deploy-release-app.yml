name: Deploy app release
run-name: Deploy ${{ inputs.tag || github.event.release.tag_name }}

on:
  # TODO: Remove manual dispatch once the release deployment workflow is stable.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing app release tag to deploy (for example app/AccessManagement-v2026.10.16)
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

# Serialize app releases, including the production approval wait.
concurrency:
  group: deploy-app-release-${{ startsWith(inputs.tag || github.event.release.tag_name, 'app/') }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve released app
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'app/')
    runs-on: ubuntu-latest
    outputs:
      vertical: ${{ steps.app.outputs.id }}
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Validate manual release tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ "$TAG" != app/* ]]; then
            echo "::error::Manual release tag must start with app/."
            exit 1
          fi

      - name: Init
        uses: $/.github/actions/init
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}

      - name: Resolve app from release tag
        id: app
        run: repoctl ci export-vertical --vertical-tag "$TAG"
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Validate released app and export release info
        id: resolve
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [[ ! -d "$VERTICAL_DIR/manifests" ]]; then
            echo "::error::Released app has no manifests directory: $VERTICAL_DIR"
            exit 1
          fi
          version="${TAG#"$VERTICAL_TAG_PREFIX"-v}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  tag-images:
    name: Tag release images
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Init
        uses: $/.github/actions/init
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          install_flux: true

      - name: Setup buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Retag app images and manifests
        shell: bash
        env:
          VERTICAL: ${{ needs.resolve.outputs.vertical }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: >-
          repoctl ci tag-app-images "$VERTICAL"
          --sha "$SOURCE_SHA"
          --version "$VERSION"
          --registry ghcr.io/altinn/altinn-auth

  tt02:
    name: Deploy release to tt02
    needs: [resolve, tag-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      deployments: write
    steps:
      - name: Init
        uses: $/.github/actions/init
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          install_flux: true

      - name: Deploy release
        uses: $/.github/actions/deploy-apps
        with:
          verticals: ${{ needs.resolve.outputs.vertical }}
          environments: tt02
          sha: ${{ needs.resolve.outputs.sha }}
          token: ${{ github.token }}

  prod:
    name: Deploy release to prod
    needs: [resolve, tt02]
    runs-on: ubuntu-latest
    environment: PROD
    permissions:
      contents: read
      packages: write
      deployments: write
    steps:
      - name: Init
        uses: $/.github/actions/init
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          install_flux: true

      - name: Deploy release
        uses: $/.github/actions/deploy-apps
        with:
          verticals: ${{ needs.resolve.outputs.vertical }}
          environments: prod
          sha: ${{ needs.resolve.outputs.sha }}
          token: ${{ github.token }}
