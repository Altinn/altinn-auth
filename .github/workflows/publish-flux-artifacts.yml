name: "Publish Flux Artifacts"
run-name: Publish accessmanagement flux artifacts to ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        required: true
        options:
          - at22
          - at23
          - at24
          - tt02
          - yt01
          - prod

env:
  SYNCROOT_ARTIFACT_NAME: accessmanagement/syncroot
  APP_ARTIFACT_NAME: accessmanagement/altinn-auth
  SYNCROOT_WORKDIR: ./src/apps/Altinn.AccessManagement/syncroot
  # Scopes what gets published, not what gets validated: validate-manifests.sh
  # renders every app under src/apps/*/manifests, this ships one of them. The
  # artifact root is manifests/, not one of its stages, because the syncroot
  # Kustomizations select ./pre-deploy/<env> and ./deploy/<env> beneath it.
  APP_WORKDIR: ./src/apps/Altinn.AccessManagement/manifests

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-flux-artifacts-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate syncroot structure
        uses: Altinn/altinn-platform/actions/flux/verify-syncroot@3535bba3d301df5778ce420f7adf10edd748cc3f # main
        with:
          workdir: ${{ env.SYNCROOT_WORKDIR }}

      - name: Check the target environment has app overlays
        shell: bash
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          # The syncroot points its Kustomizations at ./pre-deploy/<env> and
          # ./deploy/<env> inside the app manifests artifact, so the target
          # environment needs an overlay for both stages.
          for stage in pre-deploy deploy; do
            target="${APP_WORKDIR}/${stage}/${ENVIRONMENT}"
            if [ ! -f "${target}/kustomization.yaml" ]; then
              echo "::error::Missing ${target}/kustomization.yaml"
              exit 1
            fi
          done

      - name: Validate manifests
        run: ./.github/scripts/validate-manifests.sh


  publish-accessmanagement:
    name: Publish accessmanagement manifests artifact
    needs: validate
    # The federated credential backing the OIDC login is scoped to refs/heads/main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions: 
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Set up Docker
        uses: docker/setup-buildx-action@v4

      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@main

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push accessmanagement image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/apps/Altinn.AccessManagement/Dockerfile
          push: true
          tags: "ghcr.io/altinn/accessmanagement:${{ github.sha }}"

      - name: Find and Replace
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: "{{GIT_SHA}}"
          replace: "${{ github.sha }}"
          include: "src/apps/Altinn.AccessManagement/manifests/**"

      - name: Push manifests
        run: |
          flux push artifact "oci://ghcr.io/altinn/accessmanagement-manifests:${{ github.sha }}" \
            --path="./src/apps/Altinn.AccessManagement/manifests" \
            --source="$(git config --get remote.origin.url)" \
            --revision="$(git branch --show-current)@sha1:$(git rev-parse HEAD)"          

      - name: Deploy manifests to at22
        run: |
          flux tag artifact "oci://ghcr.io/altinn/accessmanagement-manifests:${{ github.sha }}" --tag at22  
