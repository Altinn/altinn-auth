name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# Cancel a superseded run when a PR is pushed again; let main-push runs finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check repository  
    runs-on: ubuntu-latest

    steps:
      - name: Init
        uses: $/.github/actions/init
      
      - name: Restore
        run: dotnet restore
      
      - name: Check repository
        run: repoctl check

  # Find what verticals to build and test
  find-verticals:
    name: Find all
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.find-verticals.outputs.matrix }}
      any: ${{ steps.find-verticals.outputs.any }}
      apps: ${{ steps.app-ids.outputs.ids }}
      apps-any: ${{ steps.find-apps.outputs.any }}

    steps:
      - name: Init
        uses: $/.github/actions/init
      
      - name: Find verticals to build and test
        id: find-verticals
        run: repoctl ci find-verticals --filter full
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Find apps to build and test
        id: find-apps
        run: repoctl ci find-verticals --filter full --kind app
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Get app vertical IDs
        id: app-ids
        shell: bash
        env:
          MATRIX: ${{ steps.find-apps.outputs.matrix }}
        run: |
          ids=$(jq -r '[.include[].id] | join(" ")' <<< "$MATRIX")
          echo "ids=$ids" >> "$GITHUB_OUTPUT"

      - name: Print find-verticals output
        run: printf '%s\n' "$MATRIX" | jq -C .
        env:
          MATRIX: ${{ steps.find-verticals.outputs.matrix }}

      - name: Print find-apps output
        run: printf '%s\n' "$MATRIX" | jq -C .
        env:
          MATRIX: ${{ steps.find-apps.outputs.matrix }}
      
      - name: Print any-vars
        run: |
          printf '%s\n' "any: $ANY"
          printf '%s\n' "apps-any: $APPS_ANY"
        env:
          ANY: ${{ steps.find-verticals.outputs.any }}
          APPS_ANY: ${{ steps.find-apps.outputs.any }}

  check-manifests:
    name: Check Manifests
    runs-on: ubuntu-latest

    needs:
      # TODO: add find-verticals output to only run this when manifests has changed
      - find-verticals

    steps:
      - name: Init
        uses: $/.github/actions/init

      - name: Validate manifests
        run: ./.github/scripts/validate-manifests.sh

  diff-manifests:
    name: Diff manifests
    if: github.event_name == 'pull_request'

    needs:
      # TODO: add find-verticals output to only run this when manifests has changed??
      - find-verticals

    uses: dis-way/actions/.github/workflows/kustomize-diff.yml@fb99a38f8177b38ff22ed45377418c4c84c7075d # main
    with:
      # base/ overlays are skipped by the reusable workflow, so the trailing * only
      # ever resolves to environment overlays.
      build-paths: "src/apps/*/manifests/pre-deploy/*,src/apps/*/manifests/deploy/*,src/apps/*/syncroot/*"
    permissions:
      contents: read
      pull-requests: write


  vertical:
    name: "${{ matrix.displayName }}: Build and Test"
    runs-on: ubuntu-latest

    needs: find-verticals
    # RepoCtl emits these flags as JSON strings, including the surrounding quotes.
    if: fromJSON(needs.find-verticals.outputs.any) == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.find-verticals.outputs.matrix) }}
    
    permissions: 
      contents: read
      packages: write
    
    steps:
      - name: Init
        uses: $/.github/actions/init
      
      # -warnaserror on both steps: NuGet audit warnings (NU19xx) are raised by
      # restore, compiler and analyzer warnings by build. Either one turns the
      # vertical red, so the build is clean or it fails.
      - name: Restore
        run: dotnet restore "$VERTICAL_DIR" -p:Configuration=Release -warnaserror -bl:binlog/restore.binlog
        env:
          VERTICAL_DIR: ${{ matrix.path }}

      - name: Build
        run: dotnet build "$VERTICAL_DIR" -c Release --no-restore -warnaserror -bl:binlog/build.binlog
        env:
          VERTICAL_DIR: ${{ matrix.path }}
      
      - name: Test
        # MTP uses xUnit's built-in TRX reporter; VSTest uses the TRX logger.
        run: repoctl vertical test "$VERTICAL_ID" -c Release --no-build -p:TestingPlatformShowTestsFailure=true -p:TestingPlatformCommandLineArguments=--report-xunit-trx --logger trx -bl:binlog/test.binlog
        env:
          VERTICAL_ID: ${{ matrix.id }}

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.slug }}
          path: ${{ matrix.path }}/**/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 7
      
      - name: Pack
        if: matrix.type == 'pkg' || matrix.type == 'tool'
        run: dotnet pack "$VERTICAL_DIR" -c Release --no-build -bl:binlog/pack.binlog
        env:
          VERTICAL_DIR: ${{ matrix.path }}
      
      - name: Setup buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@3fa784edd773d56630bb9f62645e08f70c2cff0a # v2.10.0

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push containers
        if: matrix.type == 'app'
        run: repoctl vertical containers build "$VERTICAL_ID" --tag "${{ github.sha }}" --push
        env:
          VERTICAL_ID: ${{ matrix.id }}

      - name: Build and push flux manifests
        if: matrix.type == 'app'
        run: |
          if [[ ! -d "$VERTICAL_DIR/manifests" ]]; then
            echo "No manifests directory found, skipping flux build."
            exit 0
          fi

          find "${VERTICAL_DIR}/manifests" -type f \
            -exec sed -i "s/{{GIT_SHA}}/${GITHUB_SHA}/g" {} +
          
          flux push artifact "oci://ghcr.io/altinn/altinn-auth/$VERTICAL_SHORT_SLUG-manifests:${{ github.sha }}" \
            --path="$VERTICAL_DIR/manifests" \
            --source="https://github.com/altinn/altinn-auth" \
            --revision="${GITHUB_SHA}"

        env:
          VERTICAL_DIR: ${{ matrix.path }}
          VERTICAL_SHORT_SLUG: ${{ matrix.shortSlug }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Create binlog artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.slug }}-binlog
          path: binlog/*.binlog
          if-no-files-found: error
          retention-days: 1

      - name: Create packages artifact
        if: matrix.type == 'pkg' || matrix.type == 'tool'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.slug }}-packages
          path: artifacts/**/*.nupkg
          # TODO: both tools in the repo are not actually tools, and fail this step
          if-no-files-found: ${{ matrix.type == 'pkg' && 'error' || 'ignore' }}
          retention-days: 1

  app:
    name: "Deploy built apps to test"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && fromJSON(needs.find-verticals.outputs.apps-any) == 'true'

    needs: 
      - find-verticals
      - vertical
    
    permissions: 
      contents: read
      packages: write
      deployments: write
    
    steps:
      - name: Init
        uses: $/.github/actions/init

      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@3fa784edd773d56630bb9f62645e08f70c2cff0a # v2.10.0

      - name: Deploy built apps
        uses: $/.github/actions/deploy-apps
        with:
          verticals: ${{ needs.find-verticals.outputs.apps }}
          environments: at22 at23 yt01
          token: ${{ github.token }}
