name: "Publish Syncroot"
run-name: Publish syncroot artifacts to ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Target App"
        type: choice
        required: true
        options:
          - Altinn.AccessManagement
          - Altinn.Authorization

      environment:
        description: "Target environment"
        type: choice
        required: true
        options:
          - at22
          - at23
          - at24
          - tt02
          - yt01
          - prod

env:
  SYNCROOT_ARTIFACT_NAME: accessmanagement/syncroot
  APP_ARTIFACT_NAME: accessmanagement/altinn-auth
  SYNCROOT_WORKDIR: ./src/apps/Altinn.AccessManagement/syncroot
  # Scopes what gets published, not what gets validated: validate-manifests.sh
  # renders every app under src/apps/*/manifests, this ships one of them. The
  # artifact root is manifests/, not one of its stages, because the syncroot
  # Kustomizations select ./pre-deploy/<env> and ./deploy/<env> beneath it.
  APP_WORKDIR: ./src/apps/Altinn.AccessManagement/manifests

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-flux-artifacts-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  find-verticals:
    uses: ./.github/workflows/tpl-find-verticals.yml
    with:
      type: app

  publish-app-syncroot:
    name: Publish App artifact
    needs: find-verticals
    # Push the manifests the syncroot points at first, so the OCIRepository resolves
    # as soon as Flux picks up the new syncroot.
    # The federated credential backing the OIDC login is scoped to refs/heads/main.
    # if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - run: |
          echo ${{ needs.find-verticals.outputs }}
      
      - run: |
          # 1. Capture the raw matrix JSON string outputted from your template job
          MATRIX_DATA='${{ needs.find-verticals.outputs.matrix }}'
          
          # 2. Extract the target key from your user input choice (e.g. "Altinn.AccessManagement")
          TARGET_APP="${{ github.event.inputs.app }}"
          
          # 3. Filter down to the single matching object in the include array and compact it
          ELEMENT=$(echo "$MATRIX_DATA" | jq --arg name "$TARGET_APP" -c '.include[] | select(.name == $name)')
          
          # 4. Save to step output
          echo "app_data=$ELEMENT" >> $GITHUB_OUTPUT

