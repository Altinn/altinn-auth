name: 'Post CI: Test Report'

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read
  checks: write

# Publish from the default branch so fork PRs can get check runs too.
# This workflow only parses result artifacts; it does not execute PR code.
jobs:
  report:
    name: Publish test results
    runs-on: ubuntu-latest
    steps:
      - name: Test Report
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          artifact: /test-results-(.*)/
          name: '$1: Tests'
          path: '**/*.trx'
          reporter: dotnet-trx
          list-tests: failed
          # v3.2.0 sends one more annotation than this, and GitHub rejects more than 50 (fixed upstream in 30b4bef).
          max-annotations: 49
          fail-on-empty: false
          use-actions-summary: false

      # The reporter creates each check run in progress, then updates it. When the update fails (the Checks API
      # sometimes answers 404 right after the create), the check run would stay in progress for good (#4975).
      - name: Complete check runs left in progress
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?status=in_progress&per_page=100" --paginate \
            --jq '.check_runs[] | select(.app.slug == "github-actions" and (.name | endswith(": Tests"))) | .id' |
          while read -r id; do
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/check-runs/$id" --silent \
              -f status=completed -f conclusion=neutral \
              -f 'output[title]=Test results not published' \
              -f "output[summary]=The test reporter failed before it published these results: $RUN_URL. Re-run that workflow to publish them."
            echo "Completed check run $id as neutral"
          done
