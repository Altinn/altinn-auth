name: 'Post CI: Test Report'

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read
  checks: write

# Publish from the default branch so fork PRs can get check runs too.
# This workflow only parses result artifacts; it does not execute PR code.
jobs:
  report:
    name: Publish test results
    runs-on: ubuntu-latest
    steps:
      - name: Test Report
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          artifact: /test-results-(.*)/
          name: '$1: Tests'
          path: '**/*.trx'
          reporter: dotnet-trx
          list-tests: failed
          max-annotations: 50
          fail-on-empty: false
          use-actions-summary: false
