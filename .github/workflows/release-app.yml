name: Release App

on:
  workflow_dispatch:
    inputs:
      app:
        description: What app to release
        required: true
        type: choice
        options:
          - Altinn.AccessManagement
          - Altinn.Authorization
          - Altinn.Authentication
          - Altinn.ResourceRegistry

      version:
        description: Version override (YYYY.MM.DD or YYYY.MM.DD.NNN, nonzero suffix; defaults to today's UTC date)
        type: string
        required: false

run-name: "Create release-draft for ${{ inputs.app }} by @${{ github.actor }}"

permissions:
  contents: write

concurrency:
  group: cut-release-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  create-release-draft:
    name: Create Release Draft
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ github.token }}
      APP: ${{ inputs.app }}
      COMMIT: ${{ github.sha }}
      VERSION_OVERRIDE: ${{ inputs.version }}

    steps:
      - name: Init
        uses: $/.github/actions/init
        with:
          fetch_depth: 0 # we need full history for generating the changelog with git-cliff

      - name: Install git-cliff
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          # renovate: datasource=crate depName=git-cliff
          tool: git-cliff@2.14.2

      - name: Create draft release
        run: >-
          repoctl ci draft-release "app:${APP}"
          --sha "$COMMIT"
          --version "$VERSION_OVERRIDE"
