name: Label pull request

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-autolabel-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Label changed verticals
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Read configuration and actions only from the trusted base commit.
      # Never check out or execute the PR head with this write-capable token.
      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Init
        uses: $/.github/actions/init
        with:
          checkout: false
          repoctl_version: "2.2.1"

      - name: Label changed verticals
        run: repoctl ci pr-autolabel
        env:
          GITHUB_TOKEN: ${{ github.token }}
