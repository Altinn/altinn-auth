name: "Pull Request"

# Deliberately not scoped to PRs against main: this repo stacks manifest PRs onto
# each other, and a stacked PR needs the same validation as one targeting main.
on:
  pull_request:
    paths:
      - "src/apps/**/manifests/**"
      - "src/apps/**/syncroot/**"
      - ".github/scripts/validate-manifests.sh"
      - ".github/workflows/pull-request.yml"
      - ".github/workflows/publish-flux-artifacts.yml"

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate syncroot structure
        uses: Altinn/altinn-platform/actions/flux/verify-syncroot@3535bba3d301df5778ce420f7adf10edd748cc3f # main
        with:
          workdir: ./src/apps/Altinn.AccessManagement/syncroot

      - name: Validate manifests
        run: ./.github/scripts/validate-manifests.sh

  kustomize-diff:
    name: Kustomize diff
    uses: dis-way/actions/.github/workflows/kustomize-diff.yml@8a0034943836baaa34c7e220854f950ce3a5f370 # main
    with:
      # base/ overlays are skipped by the reusable workflow, so the trailing * only
      # ever resolves to environment overlays.
      build-paths: "src/apps/*/manifests/pre-deploy/*,src/apps/*/manifests/deploy/*,src/apps/*/syncroot/*"
    permissions:
      contents: read
      pull-requests: write
