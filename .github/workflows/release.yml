on:
  push:
    branches:
      - main

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Log release output
        env:
          RELEASE_OUTPUT: ${{ toJSON(steps.release.outputs) }}
        run: 'echo "Release output: $RELEASE_OUTPUT"'

    outputs:
      release_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      full: ${{ toJSON(steps.release.outputs) }}

  publish:
    runs-on: ubuntu-latest
    if: needs.release-please.outputs.release_created == 'true'
    needs:
      - release-please

    permissions:
      contents: write

    strategy:
      matrix:
        path: ${{fromJson(needs.release-please.outputs.paths_released)}}

    steps:
      - name: Init
        uses: $/.github/actions/init
        with:
          ref: ${{ format('refs/tags/{0}', fromJSON(needs.release-please.outputs.full)[format('{0}--tag_name', matrix.path)]) }}

      - name: Build
        working-directory: ${{ matrix.path }}
        run: dotnet build -c Release

      - name: Test
        working-directory: ${{ matrix.path }}
        run: dotnet test -c Release --no-build

      - name: Pack
        working-directory: ${{ matrix.path }}
        run: dotnet pack -c Release --no-build

      - name: Create artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ fromJSON(needs.release-please.outputs.full)[format('{0}--tag_name', matrix.path)] }}
          path: artifacts/**/*.nupkg
          if-no-files-found: error

      - name: Upload packages to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FILES_GLOB: artifacts/**/*.nupkg
          RELEASE_ID: ${{ fromJSON(needs.release-please.outputs.full)[format('{0}--id', matrix.path)] }}
        run: repoctl github upload "$RELEASE_ID" "$FILES_GLOB"

  publish-github-packages:
    runs-on: ubuntu-latest
    if: needs.release-please.outputs.release_created == 'true'
    needs:
      - release-please
      - publish

    permissions:
      contents: read # required for checkout
      actions: read # required for download-artifact
      packages: write # required for publishing to GitHub Packages

    strategy:
      matrix:
        path: ${{fromJson(needs.release-please.outputs.paths_released)}}

    steps:
      - name: Init
        uses: $/.github/actions/init
        with:
          ref: ${{ format('refs/tags/{0}', fromJSON(needs.release-please.outputs.full)[format('{0}--tag_name', matrix.path)]) }}

      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ fromJSON(needs.release-please.outputs.full)[format('{0}--tag_name', matrix.path)] }}
          path: artifacts

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILES_GLOB: artifacts/**/*.nupkg
        run: |
          dotnet nuget add source --username Altinn --password "$GITHUB_TOKEN" --store-password-in-clear-text --name github "https://nuget.pkg.github.com/Altinn/index.json"
          repoctl nuget publish "$FILES_GLOB" -- --api-key "$GITHUB_TOKEN" --source "github"

  # nuget.org Trusted Publishing: NuGet/login exchanges the GitHub OIDC token for a
  # short-lived API key. The nuget.org policy (owner "altinn") must name this
  # repository, this workflow file and the "nuget" environment.
  publish-nuget:
    runs-on: ubuntu-latest
    environment: nuget
    if: needs.release-please.outputs.release_created == 'true'
    needs:
      - release-please
      - publish-github-packages

    permissions:
      contents: read # required for checkout
      actions: read # required for download-artifact
      id-token: write # required for OIDC authentication to NuGet

    strategy:
      matrix:
        path: ${{fromJson(needs.release-please.outputs.paths_released)}}

    steps:
      - name: Init
        uses: $/.github/actions/init
        with:
          ref: ${{ format('refs/tags/{0}', fromJSON(needs.release-please.outputs.full)[format('{0}--tag_name', matrix.path)]) }}

      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ fromJSON(needs.release-please.outputs.full)[format('{0}--tag_name', matrix.path)] }}
          path: artifacts

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet
        env:
          NUGET_APIKEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          FILES_GLOB: artifacts/**/*.nupkg
        run: repoctl nuget publish "$FILES_GLOB" -- --api-key "$NUGET_APIKEY" --source "https://api.nuget.org/v3/index.json"
