name: Oppgave
description: En avgrenset arbeidsoppgave, ofte et sub-issue under en feature eller epic.
type: Task
labels: ["status/triage"]
body:
  - type: textarea
    id: tldr
    attributes:
      label: TL;DR
      description: Inntil fem punkter. Hva skal gjøres, og hvorfor? Lenk til feature eller epic hvis oppgaven er en del av en større leveranse.
      value: |
        -

  - type: dropdown
    id: component
    attributes:
      label: Komponent
      options:
        - Access Management – backend og API (access-management)
        - Access Management – brukerflate og BFF (access-management-frontend)
        - Authorization – PDP, autoriserte parter og auditlogg (authorization)
        - Authentication – innlogging, tokens og systembruker (authentication)
        - Register – parter og roller (register)
        - Resource Registry – ressurser og tilgangslister (resource-registry)
        - Auditlog – logg over autorisasjonsbeslutninger (auditlog)
        - NuGet-pakker – PEP og ABAC (packages)
        - Felles biblioteker (libs)
        - Verktøy – CLI og FFB (tools)
        - Infrastruktur og CI/CD (infra)
        - Lokalt utviklingsmiljø og repo-verktøy (devex)
        - Dokumentasjon (docs)
        - Vet ikke
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Detaljer
      description: Valgfritt. Bakgrunn, tekniske notater eller lenker.

  - type: textarea
    id: done
    attributes:
      label: Ferdig når
      value: |
        - [ ]
