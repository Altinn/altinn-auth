name: Epic
description: En større leveranse som deles opp i features og oppgaver som sub-issues.
type: Epic
labels: ["status/draft"]
body:
  - type: markdown
    attributes:
      value: |
        En epic samler arbeidet. Selve oppgavene legges inn som **sub-issues**, ikke som en liste i teksten.

  - type: textarea
    id: tldr
    attributes:
      label: TL;DR
      description: Inntil fem punkter. Mål, grep og når den er ferdig.
      value: |
        - **Mål:**
        - **Grep:**
        - **Ferdig når:**

  - type: dropdown
    id: component
    attributes:
      label: Komponent
      description: Velg komponentene epicen berører. Sub-issuene får hver sine.
      multiple: true
      options:
        - Access Management – backend og API (access-management)
        - Access Management – brukerflate og BFF (access-management-frontend)
        - Authorization – PDP og autoriserte parter (authorization)
        - Authentication – innlogging, tokens og systembruker (authentication)
        - Register – parter og roller (register)
        - Resource Registry – ressurser og tilgangslister (resource-registry)
        - Auditlog – lagring av autorisasjons- og autentiseringshendelser (auditlog)
        - NuGet-pakker – PEP og ABAC (packages)
        - Felles biblioteker (libs)
        - Verktøy – CLI og FFB (tools)
        - Infrastruktur og CI/CD (infra)
        - Lokalt utviklingsmiljø og repo-verktøy (devex)
        - Dokumentasjon (docs)
        - Vet ikke
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: Bakgrunn
      description: Hvorfor nå? Hva er situasjonen i dag?

  - type: textarea
    id: scope
    attributes:
      label: Omfang
      value: |
        **Med:**
        -

        **Ikke med:**
        -

  - type: textarea
    id: done
    attributes:
      label: Ferdig når
      value: |
        - [ ]
