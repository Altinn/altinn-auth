name: "User story"
description: "Functionality described from the user's point of view, with acceptance criteria."
type: "User story"
labels: ["status/triage"]
body:
  - type: markdown
    attributes:
      value: |
        You can write in **English or Norwegian**. Du kan skrive på **engelsk eller norsk**.

  - type: textarea
    id: tldr
    attributes:
      label: "TL;DR"
      description: "Up to five bullets. Who needs what, and why?"
      value: |
        -

  - type: dropdown
    id: component
    attributes:
      label: "Component"
      description: "Select all the components the story touches."
      multiple: true
      options:
        - "Access Management – backend and API (access-management)"
        - "Access Management – UI and BFF (access-management-frontend)"
        - "Authorization – PDP and authorized parties (authorization)"
        - "Authentication – login, tokens and system user (authentication)"
        - "Register – parties and roles (register)"
        - "Resource Registry – resources and access lists (resource-registry)"
        - "Auditlog – storage of authorization and authentication events (auditlog)"
        - "NuGet packages – PEP and ABAC (packages)"
        - "Shared libraries (libs)"
        - "Tools – CLI and FFB (tools)"
        - "Shared platform – CI/CD, shared Terraform and Flux (infra)"
        - "Local development and repo tooling (devex)"
        - "Documentation (docs)"
        - "Don't know"
    validations:
      required: true

  - type: textarea
    id: story
    attributes:
      label: "User story"
      value: |
        As a **...**
        I want **...**
        so that **...**

  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance criteria"
      value: |
        - [ ]

  - type: textarea
    id: details
    attributes:
      label: "Sketches, links and dependencies"
      description: "Figma, related issues, legal clarifications or anything else the team should know."
