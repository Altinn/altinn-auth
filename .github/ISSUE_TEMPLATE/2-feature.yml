name: "Feature request"
description: "A need or an idea for something new or better in Altinn Authorization."
type: "Feature"
labels: ["status/triage"]
body:
  - type: markdown
    attributes:
      value: |
        You can write in **English or Norwegian**. Du kan skrive på **engelsk eller norsk**.

        Describe the **need** before the solution. That makes it easier for the team to find the best way to meet it.

  - type: textarea
    id: tldr
    attributes:
      label: "TL;DR"
      description: "Up to five bullets. What is wanted, and why?"
      value: |
        -

  - type: dropdown
    id: component
    attributes:
      label: "Component"
      description: "Where does the request belong? Select all that apply, or \"Don't know\"."
      multiple: true
      options:
        - "Access Management – backend and API (access-management)"
        - "Access Management – UI and BFF (access-management-frontend)"
        - "Authorization – PDP and authorized parties (authorization)"
        - "Authentication – login, tokens and system user (authentication)"
        - "Register – parties and roles (register)"
        - "Resource Registry – resources and access lists (resource-registry)"
        - "Auditlog – storage of authorization and authentication events (auditlog)"
        - "NuGet packages – PEP and ABAC (packages)"
        - "Shared libraries (libs)"
        - "Tools – CLI and FFB (tools)"
        - "Shared platform – CI/CD, shared Terraform and Flux (infra)"
        - "Local development and repo tooling (devex)"
        - "Documentation (docs)"
        - "Don't know"
    validations:
      required: true

  - type: dropdown
    id: audience
    attributes:
      label: "Who is it for?"
      multiple: true
      options:
        - "End user (citizen or organisation)"
        - "Service owner"
        - "End-user system vendor"
        - "Another Altinn product"
        - "Internal to the team"

  - type: textarea
    id: need
    attributes:
      label: "Need"
      description: "What problem does this solve? What happens today?"
      placeholder: |
        As a service owner I want to ..., so that ...

  - type: textarea
    id: solution
    attributes:
      label: "Proposed solution"
      description: "Optional. How do you imagine it could be solved?"

  - type: textarea
    id: details
    attributes:
      label: "Additional information"
      description: "Links, sketches, dependencies or deadlines."
