name: "Bug"
description: "Something does not work as it should in one of the authorization components."
type: "Bug"
labels: ["status/triage"]
body:
  - type: markdown
    attributes:
      value: |
        You can write in **English or Norwegian**. Du kan skrive på **engelsk eller norsk**.

        Only **Component** is required. One sentence is enough; the team fills in the rest in triage. Please search [open and closed issues](https://github.com/Altinn/altinn-auth/issues?q=is%3Aissue) first.

        **Do not report security vulnerabilities here.** Follow the [security policy](https://github.com/Altinn/altinn-auth/security/policy) instead.

        **Do not paste** national identity numbers, tokens, API keys, production logs or other confidential information. Use test data and a correlation ID.

  - type: textarea
    id: tldr
    attributes:
      label: "TL;DR"
      description: "Up to five bullets. What happened, who is affected, and how serious is it?"
      value: |
        -

  - type: dropdown
    id: component
    attributes:
      label: "Component"
      description: "Where do you see the bug? Select all that apply, or \"Don't know\" and the team will help in triage."
      multiple: true
      options:
        - "Access Management – backend and API (access-management)"
        - "Access Management – UI and BFF (access-management-frontend)"
        - "Authorization – PDP and authorized parties (authorization)"
        - "Authentication – login, tokens and system user (authentication)"
        - "Register – parties and roles (register)"
        - "Resource Registry – resources and access lists (resource-registry)"
        - "Auditlog – storage of authorization and authentication events (auditlog)"
        - "NuGet packages – PEP and ABAC (packages)"
        - "Shared libraries (libs)"
        - "Tools – CLI and FFB (tools)"
        - "Shared platform – CI/CD, shared Terraform and Flux (infra)"
        - "Local development and repo tooling (devex)"
        - "Documentation (docs)"
        - "Don't know"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: "Environment"
      multiple: true
      options:
        - "Production"
        - "TT02"
        - "AT"
        - "YT01"
        - "Local"
        - "Don't know"

  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
      placeholder: |
        1. Log in as ...
        2. Call `GET /accessmanagement/api/v1/...`
        3. See that ...

  - type: textarea
    id: expected
    attributes:
      label: "Expected and actual behaviour"

  - type: textarea
    id: details
    attributes:
      label: "Additional information"
      description: "Correlation ID, time, resource ID, screenshots, or a link to a Slack thread."
