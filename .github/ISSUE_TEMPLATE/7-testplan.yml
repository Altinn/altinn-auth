name: "Test plan"
description: "A plan for testing a delivery: scenarios, test data and environment."
title: "Test plan: "
type: "Task"
labels: ["Testplan", "status/draft"]
body:
  - type: markdown
    attributes:
      value: |
        You can write in **English or Norwegian**. Du kan skrive på **engelsk eller norsk**.

        A test plan can be as simple as a checklist of scenarios. Fill in what is relevant; the rest can come later.

        **Use synthetic test data** (Tenor). Do not use real national identity numbers or production data.

  - type: textarea
    id: tldr
    attributes:
      label: "TL;DR"
      description: "Up to five bullets. What is tested, where, and when must it be done?"
      value: |
        -

  - type: dropdown
    id: component
    attributes:
      label: "Component"
      description: "Select all the components the test covers."
      multiple: true
      options:
        - "Access Management – backend and API (access-management)"
        - "Access Management – UI and BFF (access-management-frontend)"
        - "Authorization – PDP and authorized parties (authorization)"
        - "Authentication – login, tokens and system user (authentication)"
        - "Register – parties and roles (register)"
        - "Resource Registry – resources and access lists (resource-registry)"
        - "Auditlog – storage of authorization and authentication events (auditlog)"
        - "NuGet packages – PEP and ABAC (packages)"
        - "Shared libraries (libs)"
        - "Tools – CLI and FFB (tools)"
        - "Shared platform – CI/CD, shared Terraform and Flux (infra)"
        - "Local development and repo tooling (devex)"
        - "Documentation (docs)"
        - "Don't know"
    validations:
      required: true

  - type: input
    id: delivery
    attributes:
      label: "Delivery under test"
      description: "Link to the epic, feature or issue."
      placeholder: "#1234"

  - type: dropdown
    id: environment
    attributes:
      label: "Test environment"
      multiple: true
      options:
        - "Local"
        - "AT"
        - "YT01"
        - "TT02"
        - "Production (verification after deploy)"

  - type: input
    id: period
    attributes:
      label: "Test period and deadline"
      placeholder: "e.g. week 44, done before the release on 12 November"

  - type: textarea
    id: scenarios
    attributes:
      label: "Test scenarios"
      description: "One scenario per line. Tick it when it passes. When something fails, create a bug and link it on the line."
      value: |
        - [ ]
        - [ ] Negative:

  - type: textarea
    id: testdata
    attributes:
      label: "Test data"
      description: "Which test users, organisations, roles and resources are needed?"

  - type: textarea
    id: nonfunctional
    attributes:
      label: "Non-functional tests"
      description: "Links to performance tests, security tests and accessibility checks when needed."

  - type: textarea
    id: dependencies
    attributes:
      label: "Dependencies and open questions"
      description: "Other teams, data or decisions the test is waiting for."

  - type: textarea
    id: out-of-scope
    attributes:
      label: "Out of scope"
      description: "What is deliberately not tested now."
